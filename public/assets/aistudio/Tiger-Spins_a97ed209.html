const $=id=>document.getElementById(id),game=$('game'),panel=$('panel'),prize=$('prize');
function resize(){game.style.setProperty('--scale',Math.min(innerWidth/674,innerHeight/1462))}
resize();onresize=resize;game.style.backgroundImage='url('+art.board+')';
const symbols=['orange','jade','packet','cracker','bag','wild'],weights=[7,4,5,5,4,1],rates=[2,8,4,3,5,50],bets=[5,10,20,50,100,200];
let credits=3942.5,level=2,win=0,sound=true,turbo=false,auto=false,busy=false,lastFocus;
try{const s=JSON.parse(localStorage.tigerArcade||'{}');if(Number.isFinite(s.credits)&&s.credits>=0)credits=s.credits;if(bets[s.level])level=s.level;sound=s.sound!==false;turbo=s.turbo===true}catch{}
function save(){try{localStorage.tigerArcade=JSON.stringify({credits,level,sound,turbo})}catch{}}
function node(tag,cls,parent){const el=document.createElement(tag);el.className=cls;parent.append(el);return el}
const money=[42,264,487].map(x=>{const m=node('div','money label',game);m.style.left=x+'px';return m});
const fmt=n=>n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function update(){[credits,bets[level],win].forEach((n,i)=>money[i].textContent='₹'+fmt(n));save()}
const columns=Array.from({length:3},()=>node('div','strip',node('div','col',$('reels'))));
function tile(id){const img=new Image();img.className='tile';img.src=art[symbols[id]];img.alt=symbols[id];return img}
function show(col,ids){col.replaceChildren(...ids.map(tile))}
[[0,1,1],[2,0,0],[3,0,1]].forEach((a,i)=>show(columns[i],a));
function button(id,label,x,y,w,h,fn){const b=node('button','hot',game);b.id=id;b.setAttribute('aria-label',label);b.title=label;Object.assign(b.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});b.onclick=fn;return b}
const lines=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];
function draw(){let r=Math.random()*26;return weights.findIndex(w=>(r-=w)<0)}
function evaluate(grid){let multiplier=0,hits=new Set();for(const path of lines){const ids=path.map((r,c)=>grid[c][r]),base=ids.find(id=>id!==5)??5;if(ids.every(id=>id===base||id===5)){multiplier+=rates[base];path.forEach((r,c)=>hits.add(c*3+r))}}if(grid.flat().every(id=>id===grid[0][0]))multiplier*=10;return {multiplier,hits}}
let audio;function tone(f){if(!sound)return;try{audio??=new AudioContext();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.start();o.stop(audio.currentTime+.16)}catch{}}
let timer,prizeTimer;
function stopAuto(){auto=false;clearTimeout(timer);autoBtn.classList.remove('active');autoBtn.textContent=''}
function next(){if(auto)timer=setTimeout(spin,750)}
function dismiss(){if(prize.hidden)return;clearTimeout(prizeTimer);prize.hidden=true;next()}
function celebrate(total,superWin){prize.hidden=false;prize.style.backgroundImage='url('+art[superWin?'super':'mega']+')';prize.focus();const start=performance.now();function count(now){if(prize.hidden)return;$('amount').textContent=fmt(total*Math.min(1,(now-start)/1100));if(now-start<1100)requestAnimationFrame(count)}requestAnimationFrame(count);prizeTimer=setTimeout(dismiss,3400)}
for(let i=0;i<13;i++){const c=node('span','coin',prize);c.textContent='🪙';c.style.left=(i*37%100)+'%';c.style.animationDelay=-(i*.37)+'s'}
prize.onclick=dismiss;prize.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();dismiss()}};
async function spin(){if(busy||!panel.hidden||!prize.hidden)return;const stake=bets[level];if(credits<stake){stopAuto();dialog('Demo credits','Choose a smaller bet or refill your demo balance.',[['Refill to ₹3,942.50',()=>{credits=3942.5;update();closePanel()}],['Back',closePanel]]);return}
busy=true;const grid=columns.map(()=>Array.from({length:3},draw));credits-=stake;win=0;money[0].textContent='₹'+fmt(credits);money[2].textContent='₹0.00';$('banner').textContent='Reels spinning…';tone(310);
await Promise.all(columns.map(async(col,c)=>{const extra=Array.from({length:8+2*c},draw);show(col,[...grid[c],...extra,...Array.from({length:3},draw)]);const a=col.animate([{transform:'translateY(-'+((extra.length+3)*182)+'px)'},{transform:'translateY(0)'}],{duration:(turbo?270:790)+c*(turbo?85:180),easing:'cubic-bezier(.15,.52,.24,1)'});await a.finished;show(col,grid[c]);tone(420+80*c)}));
const {multiplier,hits}=evaluate(grid);hits.forEach(p=>columns[Math.floor(p/3)].children[p%3].classList.add('hit'));win=stake*multiplier;credits+=win;update();busy=false;$('banner').textContent=win?'Win '+fmt(win):'×10 multiplier with full screen win!';if(multiplier>=5){tone(890);celebrate(win,multiplier>=12)}else next()}
function dialog(title,description,choices){stopAuto();if(panel.hidden)lastFocus=document.activeElement;panel.hidden=false;$('heading').textContent=title;$('info').textContent=description;$('actions').replaceChildren();for(const [name,fn] of choices){const b=node('button','',$('actions'));b.textContent=name;b.onclick=fn}$('actions').firstChild.focus()}
function closePanel(){panel.hidden=true;lastFocus?.focus()}
function settings(){if(busy)return;dialog('Tiger settings','Five lines play on every spin. Match three symbols across a row or diagonal. WILD substitutes for any symbol.',[['Sound · '+(sound?'On':'Off'),()=>{sound=!sound;save();settings()}],['View payouts',()=>dialog('Paytable','Each winning line pays a multiple of your bet. Orange ×2 · Firecrackers ×3 · Envelopes ×4 · Coin bag ×5 · Jade ×8 · Three WILDs ×50. Nine identical symbols multiply the total by 10.',[['Back',settings],['Play',closePanel]])],['Play',closePanel]])}
button('settings','Settings',572,145,90,90,settings);button('pause','Pause game',4,145,90,90,()=>{if(!busy)dialog('Game paused','Your demo balance is ₹'+fmt(credits)+'.',[['Resume game',closePanel]])});
function adjust(d){if(!busy&&!auto){level=Math.max(0,Math.min(bets.length-1,level+d));update()}}
button('minus','Decrease bet',140,1150,87,90,()=>adjust(-1));button('plus','Increase bet',443,1150,87,90,()=>adjust(1));button('spin','Spin',258,1136,157,158,spin);
const fast=button('turbo','Turbo speed',37,1150,87,90,()=>{turbo=!turbo;syncFast();save()});function syncFast(){fast.classList.toggle('active',turbo);fast.textContent=turbo?'⚡ ON':''}syncFast();
const autoBtn=button('auto','Toggle auto spin',545,1150,90,90,()=>{if(auto){stopAuto();return}if(!busy){auto=true;autoBtn.classList.add('active');autoBtn.textContent='■ STOP';spin()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAuto()});update();
</script></html>
